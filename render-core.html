<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TextMuy Render Core</title>
    <!--
      Render Core: motor de render HEADLESS del modulo TextMuy.
      CONTRATO PUBLICO con Personalizador PDF (y cualquier consumidor, ver AGENTS.md):
        - Carga solo el motor de render (sin UI): fonts + effects + editor + export + api.
        - Expone window.TextMuyAPI.renderBatch([{id, text, preset|settings, width, height}], {onProgress})
          -> [{id, blob}] y window.RenderCore = {version, ready} cuando todo esta disponible.
        - Google Fonts: SIN <link> masivo. fonts.js inyecta solo la familia de
          cada item (campo google del fonts.json de uploads) via
          ensureGoogleFontBySpec() justo antes de renderizar. Al abrir: cero fuentes.
      Para la UI del editor usar index.html, no esta pagina.
    -->
</head>
<body>
    <script src="js/fonts.js?v=RC22"></script>
    <script src="js/effects/distort-engine.js?v=RC22"></script>
    <script src="js/effects/bevel-webgl.js?v=RC22"></script>
    <script src="js/effects/specular-webgl.js?v=RC22"></script>
    <script src="js/editor.js?v=RC22"></script>
    <!-- preset-manager: necesario para resolver presets .txm (settingsFromDelta). -->
    <script src="js/preset-manager.js?v=RC22"></script>
    <script src="js/export.js?v=RC22"></script>
    <script src="js/api.js?v=RC22"></script>
    <script>
    (function() {
        'use strict';
        // ExportManager necesita la referencia al editor (en la UI lo hace main.js).
        if (window.ExportManager && window.TextEditor) {
            window.ExportManager.init(window.TextEditor);
        }
        window.RenderCore = { version: 1, ready: true };
        // Handshake al parent (same-origin): el consumidor puede sondear window.RenderCore
        // o escuchar este mensaje.
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'render-core-ready', version: 1 }, window.location.origin);
            }
        } catch (_) { /* queda el sondeo */ }
    })();
    </script>
</body>
</html>
